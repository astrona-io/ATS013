# Course manifest for ATS013 - Installation, Upgrade And Configuration
# (Istio Certified Associate).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section quiz and then the section capstone close the
# section. Playgrounds are not listed: the landing page's playground marker
# shows them. Never list a lab's solution.md here.
#
# Every `path:` is relative to this file.

training:
  id: ATS013
  title: "ICA: Installation, Upgrade And Configuration"
  description: >
    Training material covering the Istio Certified Associate (ICA)
    Installation, Upgrade And Configuration domain: installing with istioctl
    and Helm, customizing the installation, controlling sidecar injection,
    canary and in-place upgrades, and ambient mode with waypoint proxies.
    Each module pairs a layered reader with an ungraded hands-on playground
    and a graded practice lab. Each section closes with a knowledge check
    and an integration capstone.
    Built and verified against Istio 1.30.5.

  certification:
    name: Istio Certified Associate
    code: ICA
    provider: CNCF / Linux Foundation
    domain: Installation, Upgrade And Configuration
    weight: 20

modules:

