- id: ats013-final-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why the base chart comes first
  source_readings:
  - sections/section-030/module-01/course-02-how-upgrade-computes-values.md
  prompt: "`helm install istiod istio/istiod -n istio-system` fails with `resource
    mapping not found ... ensure CRDs are installed first`. What is the fix?"
  options:
  - id: a
    text: Create the `istio-system` namespace.
    explanation: Not correct. The order `base` → `istiod` → `gateway` is a dependency,
      not a convention. The rejection comes from the **API server**, which does not
      know the kind, rather than from Helm detecting a missing chart dependency. Read
      the kind named in the error.
  - id: b
    text: Add `--skip-crds`.
    explanation: Not correct. The order `base` → `istiod` → `gateway` is a dependency,
      not a convention. The rejection comes from the **API server**, which does not
      know the kind, rather than from Helm detecting a missing chart dependency. Read
      the kind named in the error.
  - id: c
    text: Run `helm repo update` and retry.
    explanation: Not correct. The order `base` → `istiod` → `gateway` is a dependency,
      not a convention. The rejection comes from the **API server**, which does not
      know the kind, rather than from Helm detecting a missing chart dependency. Read
      the kind named in the error.
  - id: d
    text: Install `istio/base` first, it defines the CRDs that the `istiod` chart's
      objects depend on.
    explanation: Correct. The order `base` → `istiod` → `gateway` is a dependency,
      not a convention. The rejection comes from the **API server**, which does not
      know the kind, rather than from Helm detecting a missing chart dependency. Read
      the kind named in the error.
  correct_option: d
  explanation: The order `base` → `istiod` → `gateway` is a dependency, not a convention.
    The rejection comes from the **API server**, which does not know the kind, rather
    than from Helm detecting a missing chart dependency. Read the kind named in the
    error.
- id: ats013-final-q04
  type: single_choice
  difficulty: advanced
  learning_objective: Match a Gateway selector to a Helm gateway
  source_readings:
  - sections/section-010/module-02/course-02-installing-the-releases.md
  prompt: 'A gateway installed as `helm install edge-gw istio/gateway -n edge` is
    not selected by a `Gateway` resource matching `istio: ingressgateway`. Why?'
  options:
  - id: a
    text: 'The chart derives the Deployment name, Service name and pod labels from
      the **release name**, so the workload is labelled `istio: edge-gw`.'
    explanation: Correct. The release name is part of the contract your traffic configuration
      depends on, not a cosmetic choice. Either rename the release or change the selector.
  - id: b
    text: The gateway chart applies no `istio:` label.
    explanation: Not correct. The release name is part of the contract your traffic
      configuration depends on, not a cosmetic choice. Either rename the release or
      change the selector.
  - id: c
    text: The `Gateway` resource must live in the same namespace as the workload.
    explanation: Not correct. The release name is part of the contract your traffic
      configuration depends on, not a cosmetic choice. Either rename the release or
      change the selector.
  - id: d
    text: "`Gateway` resources only select workloads in `istio-system`."
    explanation: Not correct. The release name is part of the contract your traffic
      configuration depends on, not a cosmetic choice. Either rename the release or
      change the selector.
  correct_option: a
  explanation: The release name is part of the contract your traffic configuration
    depends on, not a cosmetic choice. Either rename the release or change the selector.
