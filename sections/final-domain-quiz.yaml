- id: ats013-final-q09
  type: single_choice
  difficulty: beginner
  learning_objective: Explain how helm upgrade computes values
  source_readings:
  - sections/section-030/module-01/course-02-how-upgrade-computes-values.md
  prompt: "`helm upgrade istiod istio/istiod -n istio-system --version 1.30.5 --set
    pilot.traceSampling=1.0` runs with no other flags, on a release that was installed
    with `-f values.yaml`. What happens to the values from `values.yaml`?"
  options:
  - id: a
    text: Only keys still present in the new chart are kept.
    explanation: Not correct. As soon as you pass any value, `helm upgrade` computes
      the release from chart defaults plus what you pass **on this run**; only an
      upgrade with no values at all reuses the previous ones. `--reuse-values` opts
      into carrying the previous set over, but it also keeps the old chart's defaults
      (the Istio image tag included), and it merges rather than replaces, so a `-f`
      file that removes a key does not remove it. One complete committed file passed
      every time avoids both traps.
  - id: b
    text: Values are carried over automatically.
    explanation: Not correct. As soon as you pass any value, `helm upgrade` computes
      the release from chart defaults plus what you pass **on this run**; only an
      upgrade with no values at all reuses the previous ones. `--reuse-values` opts
      into carrying the previous set over, but it also keeps the old chart's defaults
      (the Istio image tag included), and it merges rather than replaces, so a `-f`
      file that removes a key does not remove it. One complete committed file passed
      every time avoids both traps.
  - id: c
    text: 'They are dropped: the release falls back to chart defaults plus the one
      `--set` value, and the command reports success.'
    explanation: Correct. As soon as you pass any value, `helm upgrade` computes the
      release from chart defaults plus what you pass **on this run**; only an upgrade
      with no values at all reuses the previous ones. `--reuse-values` opts into carrying
      the previous set over, but it also keeps the old chart's defaults (the Istio
      image tag included), and it merges rather than replaces, so a `-f` file that
      removes a key does not remove it. One complete committed file passed every time
      avoids both traps.
  - id: d
    text: The upgrade fails.
    explanation: Not correct. As soon as you pass any value, `helm upgrade` computes
      the release from chart defaults plus what you pass **on this run**; only an
      upgrade with no values at all reuses the previous ones. `--reuse-values` opts
      into carrying the previous set over, but it also keeps the old chart's defaults
      (the Istio image tag included), and it merges rather than replaces, so a `-f`
      file that removes a key does not remove it. One complete committed file passed
      every time avoids both traps.
  correct_option: c
  explanation: As soon as you pass any value, `helm upgrade` computes the release
    from chart defaults plus what you pass **on this run**; only an upgrade with no
    values at all reuses the previous ones. `--reuse-values` opts into carrying the
    previous set over, but it also keeps the old chart's defaults (the Istio image
    tag included), and it merges rather than replaces, so a `-f` file that removes
    a key does not remove it. One complete committed file passed every time avoids
    both traps.
- id: ats013-final-q10
  type: single_choice
  difficulty: beginner
  learning_objective: Interpret a control plane and data plane version difference
  source_readings:
  - sections/section-010/module-01/course-04-reconciliation-and-removal.md
  prompt: "`istioctl version` reports `control plane version: 1.30.5` and `data plane
    version: 1.29.8 (4 proxies)`. Traffic is healthy. What is this?"
  options:
  - id: a
    text: A broken upgrade that must be rolled back.
    explanation: Not correct. A proxy's image is fixed at pod creation, so a control-plane
      upgrade cannot rewrite every pod's stored spec. Istio supports one minor version
      of skew precisely so a rolling upgrade is possible. It is a window to pass through,
      not a resting place, and it is why you never skip a minor version.
  - id: b
    text: Supported version skew, the upgrade is incomplete until every injected workload,
      gateways included, is restarted.
    explanation: Correct. A proxy's image is fixed at pod creation, so a control-plane
      upgrade cannot rewrite every pod's stored spec. Istio supports one minor version
      of skew precisely so a rolling upgrade is possible. It is a window to pass through,
      not a resting place, and it is why you never skip a minor version.
  - id: c
    text: A reporting bug in `istioctl`.
    explanation: Not correct. A proxy's image is fixed at pod creation, so a control-plane
      upgrade cannot rewrite every pod's stored spec. Istio supports one minor version
      of skew precisely so a rolling upgrade is possible. It is a window to pass through,
      not a resting place, and it is why you never skip a minor version.
  - id: d
    text: Normal steady state; proxies never match the control plane.
    explanation: Not correct. A proxy's image is fixed at pod creation, so a control-plane
      upgrade cannot rewrite every pod's stored spec. Istio supports one minor version
      of skew precisely so a rolling upgrade is possible. It is a window to pass through,
      not a resting place, and it is why you never skip a minor version.
  correct_option: b
  explanation: A proxy's image is fixed at pod creation, so a control-plane upgrade
    cannot rewrite every pod's stored spec. Istio supports one minor version of skew
    precisely so a rolling upgrade is possible. It is a window to pass through, not
    a resting place, and it is why you never skip a minor version.
- id: ats013-final-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe what installing a revision creates
  source_readings:
  - sections/section-010/module-01/course-01-render-and-apply-pipeline.md
  prompt: What does `istioctl install --set profile=minimal --set revision=1-30-5`
    do to running workloads?
  options:
  - id: a
    text: It migrates every meshed namespace to the new revision.
    explanation: Not correct. A revision suffixes every namespaced object it owns,
      and reconciliation is scoped by the `istio.io/rev` ownership label, so the new
      install cannot see or prune the default revision's objects. Installing a revision
      is completely non-disruptive, which is the property that makes canary upgrades
      safe to start.
  - id: b
    text: It replaces the existing control plane in place.
    explanation: Not correct. A revision suffixes every namespaced object it owns,
      and reconciliation is scoped by the `istio.io/rev` ownership label, so the new
      install cannot see or prune the default revision's objects. Installing a revision
      is completely non-disruptive, which is the property that makes canary upgrades
      safe to start.
  - id: c
    text: It restarts injected pods so they attach to the new revision.
    explanation: Not correct. A revision suffixes every namespaced object it owns,
      and reconciliation is scoped by the `istio.io/rev` ownership label, so the new
      install cannot see or prune the default revision's objects. Installing a revision
      is completely non-disruptive, which is the property that makes canary upgrades
      safe to start.
  - id: d
    text: Nothing. It creates a second control plane; no pod moves until it is recreated.
    explanation: Correct. A revision suffixes every namespaced object it owns, and
      reconciliation is scoped by the `istio.io/rev` ownership label, so the new install
      cannot see or prune the default revision's objects. Installing a revision is
      completely non-disruptive, which is the property that makes canary upgrades
      safe to start.
  correct_option: d
  explanation: A revision suffixes every namespaced object it owns, and reconciliation
    is scoped by the `istio.io/rev` ownership label, so the new install cannot see
    or prune the default revision's objects. Installing a revision is completely non-disruptive,
    which is the property that makes canary upgrades safe to start.
- id: ats013-final-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Retire an old revision
  source_readings:
  - sections/section-030/module-02/course-03-revision-tags.md
  prompt: Every namespace has moved to revision `1-30-5` and been restarted. How do
    you retire the old control plane?
  options:
  - id: a
    text: "`istioctl uninstall --revision default -y`"
    explanation: Correct. `--purge` removes **every** revision plus the shared cluster-scoped
      resources and CRDs, including the canary you just promoted. Deleting the Deployment
      by hand leaves its Service, webhook and cluster resources behind. Name the revision.
  - id: b
    text: "`kubectl -n istio-system delete deployment istiod`"
    explanation: Not correct. `--purge` removes **every** revision plus the shared
      cluster-scoped resources and CRDs, including the canary you just promoted. Deleting
      the Deployment by hand leaves its Service, webhook and cluster resources behind.
      Name the revision.
  - id: c
    text: "`istioctl tag remove default -y`"
