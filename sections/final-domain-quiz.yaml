- id: ats013-final-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Predict what a layer 7 policy does without a waypoint
  source_readings:
  - sections/section-040/module-01/course-02-enrollment-and-the-l4-boundary.md
  prompt: In an ambient namespace with **no waypoint**, you apply an `AuthorizationPolicy`
    denying everything except HTTP `GET`. What happens?
  options:
  - id: a
    text: The policy is rejected at admission.
    explanation: 'Not correct. `AuthorizationPolicy` is one CRD spanning two layers.
      Rules on `principals`, namespaces or ports are L4 and enforceable by ztunnel;
      rules on methods, paths or headers are L7 and need an HTTP-aware proxy in the
      path. The silent no-op is the most common ambient-mode mistake, and it is a
      security problem: the restriction you believe is in place is not.'
  - id: b
    text: It is accepted, reports healthy, and has no effect, ztunnel is L4 and cannot
      read the method.
    explanation: 'Correct. `AuthorizationPolicy` is one CRD spanning two layers. Rules
      on `principals`, namespaces or ports are L4 and enforceable by ztunnel; rules
      on methods, paths or headers are L7 and need an HTTP-aware proxy in the path.
      The silent no-op is the most common ambient-mode mistake, and it is a security
      problem: the restriction you believe is in place is not.'
  - id: c
    text: All traffic is denied because the rule cannot be evaluated.
    explanation: 'Not correct. `AuthorizationPolicy` is one CRD spanning two layers.
      Rules on `principals`, namespaces or ports are L4 and enforceable by ztunnel;
      rules on methods, paths or headers are L7 and need an HTTP-aware proxy in the
      path. The silent no-op is the most common ambient-mode mistake, and it is a
      security problem: the restriction you believe is in place is not.'
  - id: d
    text: ztunnel enforces it.
    explanation: 'Not correct. `AuthorizationPolicy` is one CRD spanning two layers.
      Rules on `principals`, namespaces or ports are L4 and enforceable by ztunnel;
      rules on methods, paths or headers are L7 and need an HTTP-aware proxy in the
      path. The silent no-op is the most common ambient-mode mistake, and it is a
      security problem: the restriction you believe is in place is not.'
  correct_option: b
  explanation: "`AuthorizationPolicy` is one CRD spanning two layers. Rules on `principals`,
    namespaces or ports are L4 and enforceable by ztunnel; rules on methods, paths
    or headers are L7 and need an HTTP-aware proxy in the path. The silent no-op is
    the most common ambient-mode mistake, and it is a security problem: the restriction
    you believe is in place is not."
- id: ats013-final-q15
  type: single_choice
  difficulty: beginner
  learning_objective: Predict the effect of deleting a waypoint
  source_readings:
  - sections/section-040/module-02/course-03-scoping-and-removing-waypoints.md
  prompt: A waypoint is deleted from a namespace that relied on it for an L7 authorization
    rule. What is the immediate effect?
  options:
  - id: a
    text: ztunnel takes over the L7 rule.
    explanation: Not correct. Deleting a waypoint degrades the mesh to L4 rather than
      breaking it. Identity, encryption and L4 authorization are ztunnel's job and
      are untouched; HTTP routing, header manipulation, retries, timeouts and L7 authorization
      all go away, while the policy object remains, looking healthy. A waypoint's
      absence is indistinguishable from its silence.
  - id: b
    text: The `AuthorizationPolicy` is deleted with it.
    explanation: Not correct. Deleting a waypoint degrades the mesh to L4 rather than
      breaking it. Identity, encryption and L4 authorization are ztunnel's job and
      are untouched; HTTP routing, header manipulation, retries, timeouts and L7 authorization
      all go away, while the policy object remains, looking healthy. A waypoint's
      absence is indistinguishable from its silence.
  - id: c
    text: Traffic stops until it is recreated.
    explanation: Not correct. Deleting a waypoint degrades the mesh to L4 rather than
      breaking it. Identity, encryption and L4 authorization are ztunnel's job and
      are untouched; HTTP routing, header manipulation, retries, timeouts and L7 authorization
      all go away, while the policy object remains, looking healthy. A waypoint's
      absence is indistinguishable from its silence.
  - id: d
    text: Traffic keeps flowing with mTLS and L4 policy intact, while the L7 rule
      silently stops being enforced.
    explanation: Correct. Deleting a waypoint degrades the mesh to L4 rather than
      breaking it. Identity, encryption and L4 authorization are ztunnel's job and
      are untouched; HTTP routing, header manipulation, retries, timeouts and L7 authorization
      all go away, while the policy object remains, looking healthy. A waypoint's
      absence is indistinguishable from its silence.
  correct_option: d
  explanation: Deleting a waypoint degrades the mesh to L4 rather than breaking it.
    Identity, encryption and L4 authorization are ztunnel's job and are untouched;
    HTTP routing, header manipulation, retries, timeouts and L7 authorization all
    go away, while the policy object remains, looking healthy. A waypoint's absence
    is indistinguishable from its silence.
- id: ats013-final-q16
  type: single_choice
  difficulty: beginner
  learning_objective: Check a finished installation with istioctl verify-install
  source_readings:
  - sections/section-010/module-03/course-02-verify-install-and-analyze.md
  prompt: A script must stop when the installed control plane is incomplete or a Deployment
    is not ready. Which command exits with a non-zero code in that case?
  options:
  - id: a
    text: "`istioctl verify-install`"
    explanation: Correct. It compares the cluster with the expected manifests, reports
      a missing object or a Deployment that is not ready and exits with a non-zero
      code.
  - id: b
    text: "`istioctl manifest generate`"
    explanation: This command renders manifests and never contacts the cluster.
  - id: c
    text: "`istioctl profile list`"
    explanation: This command only prints the names of the built-in profiles.
  - id: d
    text: "`istioctl profile dump default`"
    explanation: This command prints a profile and never reads the cluster.
  correct_option: a
  explanation: It compares the cluster with the expected manifests, reports a missing
    object or a Deployment that is not ready and exits with a non-zero code.
- id: ats013-final-q17
  type: single_choice
  difficulty: beginner
  learning_objective: Read the analysis code IST0103 and fix it
  source_readings:
  - sections/section-010/module-03/course-02-verify-install-and-analyze.md
  prompt: "`istioctl analyze -n shop` reports `IST0103` for the pods of a namespace
    that has `istio-injection=enabled`. What does it mean and what fixes it?"
  options:
  - id: a
    text: The namespace needs a revision tag, so remove the injection label.
    explanation: A revision tag is not the cause of this message.
  - id: b
    text: The injection webhook certificate expired, so `istioctl install` must run
      again.
    explanation: The message names a pod without a sidecar, not a webhook failure.
  - id: c
    text: The pods have no sidecar because they were created before the label was
      set. Restart the workloads so the webhook injects the sidecar.
    explanation: Correct. Injection runs only when a pod is created, so a label set
      later does not change running pods.
  - id: d
    text: A `VirtualService` refers to a missing host, so delete the `VirtualService`.
    explanation: That is the message `IST0101`, and the fix is to correct the reference,
      not to delete the object.
  correct_option: c
  explanation: Injection runs only when a pod is created, so a label set later does
    not change running pods.
- id: ats013-final-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: Set resources for a component with the k8s block
  source_readings:
  - sections/section-020/module-03/course-01-components-and-kubernetes-overlays.md
  prompt: Where do you set the CPU request of `istiod` in an `IstioOperator` file?
  options:
  - id: a
    text: "`spec.components.base.k8s.resources`"
    explanation: The `base` component holds the CRDs and cluster-wide objects, not
      a workload.
  - id: b
    text: "`spec.components.pilot.k8s.resources.requests.cpu`"
    explanation: Correct. The `pilot` component is `istiod`, and `k8s.resources` sets
      the requests of its Deployment.
  - id: c
    text: "`spec.meshConfig.defaultConfig.resources`"
    explanation: This key does not set the `istiod` Deployment resources.
  - id: d
    text: "`spec.values.global.proxy.resources`"
    explanation: This sets the resources of injected sidecars, not of `istiod`.
  correct_option: b
  explanation: The `pilot` component is `istiod`, and `k8s.resources` sets the requests
    of its Deployment.
- id: ats013-final-q19
  type: single_choice
  difficulty: intermediate
  learning_objective: Change the ingress gateway Service type
  source_readings:
  - sections/section-020/module-03/course-02-ingress-gateway-service-and-scaling.md
  prompt: On a `kind` cluster the ingress gateway Service shows `<pending>` as its
    external address. Which change in the `IstioOperator` file makes the gateway reachable
    on a fixed port?
  options:
  - id: a
    text: Set `meshConfig.ingressService`.
    explanation: This field selects a Service for ingress control and does not change
      the gateway Service.
  - id: b
    text: Set `components.ingressGateways[].k8s.hpaSpec`.
    explanation: This sets autoscaler bounds, not the Service.
  - id: c
    text: 'Set `components.ingressGateways[].enabled: false`.'
    explanation: This removes the gateway.
  - id: d
    text: 'Set `components.ingressGateways[].k8s.service.type: NodePort` and a `nodePort`
      on the port.'
    explanation: Correct. `kind` has no load balancer, and a `NodePort` Service opens
      a fixed port on the node.
  correct_option: d
  explanation: "`kind` has no load balancer, and a `NodePort` Service opens a fixed
    port on the node."
- id: ats013-final-q20
  type: single_choice
  difficulty: advanced
  learning_objective: Predict the effect of an ambient label on pods that have sidecars
  source_readings:
  - sections/section-040/module-03/course-01-sidecar-and-ambient-side-by-side.md
  prompt: A namespace has `istio-injection=enabled` and its pods carry sidecars. You
    add `istio.io/dataplane-mode=ambient` and change nothing else. What happens to
    the running pods?
  options:
  - id: a
    text: They keep their sidecars, and ztunnel does not capture them.
    explanation: Correct. A pod that has a sidecar is not captured by ztunnel, and
      a label change does not remove a container from a running pod.
  - id: b
    text: They lose their sidecars at once.
    explanation: A label change never removes a container from a running pod.
  - id: c
    text: They restart automatically.
    explanation: No controller restarts the pods because of a label.
  - id: d
    text: They run with a sidecar and with ztunnel at the same time.
    explanation: A pod uses one mode.
  correct_option: a
  explanation: A pod that has a sidecar is not captured by ztunnel, and a label change
    does not remove a container from a running pod.
- id: ats013-final-q21
  type: single_choice
  difficulty: intermediate
  learning_objective: Order the steps of a sidecar to ambient migration
  source_readings:
  - sections/section-040/module-03/course-02-migrating-a-namespace-to-ambient.md
  prompt: Which order migrates a namespace from sidecar to ambient mode safely?
  options:
  - id: a
    text: Restart the Deployments, then swap the labels.
    explanation: The new pods would get a sidecar again, because the injection label
      is still set.
  - id: b
    text: Delete the namespace and create it again.
    explanation: This is not needed and removes the workloads.
  - id: c
    text: Swap the labels, restart the Deployments, then verify membership and traffic.
    explanation: Correct. The new pods are created without a sidecar and are enrolled
      by the ambient label.
  - id: d
    text: Reinstall Istio with the ambient profile, then restart.
    explanation: The cluster already runs the ambient data plane, and a reinstall
      changes nothing for the namespace.
  correct_option: c
  explanation: The new pods are created without a sidecar and are enrolled by the
    ambient label.
