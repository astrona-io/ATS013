- id: ats013-final-q06
  type: single_choice
  difficulty: beginner
  learning_objective: Predict the effect of re-running istioctl install with another
    profile
  source_readings:
  - sections/section-020/module-01/course-03-writing-validating-reapplying.md
  prompt: You install from `istio-custom.yaml`, which disables the egress gateway.
    A colleague later runs `istioctl install --set profile=demo -y`. What happens?
  options:
  - id: a
    text: The two inputs are merged.
    explanation: Not correct. Reconciliation deletes what the new document omits and
      restores what the profile contains. Istio tracks its own objects through ownership
      labels, so it knows exactly which ones to prune. This is the argument for one
      committed file per control plane, passed on every run.
  - id: b
    text: The egress gateway returns, because the install reconciles the cluster to
      the document it was given.
    explanation: Correct. Reconciliation deletes what the new document omits and restores
      what the profile contains. Istio tracks its own objects through ownership labels,
      so it knows exactly which ones to prune. This is the argument for one committed
      file per control plane, passed on every run.
  - id: c
    text: The command fails with a conflict.
    explanation: Not correct. Reconciliation deletes what the new document omits and
      restores what the profile contains. Istio tracks its own objects through ownership
      labels, so it knows exactly which ones to prune. This is the argument for one
      committed file per control plane, passed on every run.
  - id: d
    text: Nothing; the profile is unchanged.
    explanation: Not correct. Reconciliation deletes what the new document omits and
      restores what the profile contains. Istio tracks its own objects through ownership
      labels, so it knows exactly which ones to prune. This is the argument for one
      committed file per control plane, passed on every run.
  correct_option: b
  explanation: Reconciliation deletes what the new document omits and restores what
    the profile contains. Istio tracks its own objects through ownership labels, so
    it knows exactly which ones to prune. This is the argument for one committed file
    per control plane, passed on every run.
- id: ats013-final-q07
  type: single_choice
  difficulty: advanced
  learning_objective: Apply the pod-label precedence rule for sidecar injection
  source_readings:
  - sections/section-020/module-02/course-02-the-precedence-rules.md
  prompt: 'A namespace carries `istio-injection=enabled`. You add `sidecar.istio.io/inject:
    "false"` to a Deployment''s own `metadata.labels` and restart it. The pods are
    still injected. Why?'
  options:
  - id: a
    text: Namespace labels always win over pod labels.
    explanation: 'Not correct. A label on the Deployment is never copied to the pod
      unless it is in the template. The manifest applies cleanly and achieves nothing,
      which is what makes this the most expensive injection mistake. (Note *C* is
      wrong in general: the pod-template label beats the namespace in both directions.).'
  - id: b
    text: The change needs a second restart to take effect.
    explanation: 'Not correct. A label on the Deployment is never copied to the pod
      unless it is in the template. The manifest applies cleanly and achieves nothing,
      which is what makes this the most expensive injection mistake. (Note *C* is
      wrong in general: the pod-template label beats the namespace in both directions.).'
  - id: c
    text: The label must be `"disabled"`, not `"false"`.
    explanation: 'Not correct. A label on the Deployment is never copied to the pod
      unless it is in the template. The manifest applies cleanly and achieves nothing,
      which is what makes this the most expensive injection mistake. (Note *C* is
      wrong in general: the pod-template label beats the namespace in both directions.).'
  - id: d
    text: The webhook is registered against Pods and evaluates its selector against
      the Pod, the label must be on `spec.template.metadata.labels`.
    explanation: 'Correct. A label on the Deployment is never copied to the pod unless
      it is in the template. The manifest applies cleanly and achieves nothing, which
      is what makes this the most expensive injection mistake. (Note *C* is wrong
      in general: the pod-template label beats the namespace in both directions.).'
  correct_option: d
  explanation: 'A label on the Deployment is never copied to the pod unless it is
    in the template. The manifest applies cleanly and achieves nothing, which is what
    makes this the most expensive injection mistake. (Note *C* is wrong in general:
    the pod-template label beats the namespace in both directions.)'
- id: ats013-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Resolve a namespace with an injection label and a revision label
  source_readings:
  - sections/section-030/module-02/course-03-revision-tags.md
  prompt: A namespace carries both `istio-injection=enabled` and `istio.io/rev=1-30-5`.
    Which control plane serves it?
  options:
  - id: a
    text: The default control plane.
    explanation: 'Correct. It follows from the webhook selectors, not from conflict-resolution
      logic: the default webhook requires `istio-injection: enabled`, and the revisioned
      webhook requires `istio.io/rev` **and** that `istio-injection` is absent. A
      namespace with both satisfies only the first, which is why a canary upgrade
      can appear to do nothing.'
  - id: b
    text: Neither.
    explanation: 'Not correct. It follows from the webhook selectors, not from conflict-resolution
      logic: the default webhook requires `istio-injection: enabled`, and the revisioned
      webhook requires `istio.io/rev` **and** that `istio-injection` is absent. A
      namespace with both satisfies only the first, which is why a canary upgrade
      can appear to do nothing.'
  - id: c
    text: Both.
    explanation: 'Not correct. It follows from the webhook selectors, not from conflict-resolution
      logic: the default webhook requires `istio-injection: enabled`, and the revisioned
      webhook requires `istio.io/rev` **and** that `istio-injection` is absent. A
      namespace with both satisfies only the first, which is why a canary upgrade
      can appear to do nothing.'
  - id: d
    text: Revision `1-30-5`.
    explanation: 'Not correct. It follows from the webhook selectors, not from conflict-resolution
      logic: the default webhook requires `istio-injection: enabled`, and the revisioned
      webhook requires `istio.io/rev` **and** that `istio-injection` is absent. A
      namespace with both satisfies only the first, which is why a canary upgrade
      can appear to do nothing.'
  correct_option: a
  explanation: 'It follows from the webhook selectors, not from conflict-resolution
    logic: the default webhook requires `istio-injection: enabled`, and the revisioned
    webhook requires `istio.io/rev` **and** that `istio-injection` is absent. A namespace
    with both satisfies only the first, which is why a canary upgrade can appear to
