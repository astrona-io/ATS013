- id: ats013-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Explain that istioctl install renders and applies once
  source_readings:
  - sections/section-030/module-03/course-01-replacing-the-control-plane.md
  prompt: "`istioctl install --set profile=demo -y` completes. Which statement about
    the cluster is now true?"
  options:
  - id: a
    text: The manifests were rendered server-side by `istiod` from the profile name
      you passed.
    explanation: 'Not correct. `istioctl install` is client-side templating plus an
      apply: load the profile, overlay `--set` and `-f`, render to manifests, apply,
      wait. The `IstioOperator` is an *input format*, not an object doing work in
      the cluster. Older Istio really did run an in-cluster operator; that model is
      gone, which is why a hand-edit to an installed object persists until the next
      install overwrites it.'
  - id: b
    text: An Istio operator pod is running and will reconcile the `IstioOperator`
      resource continuously.
    explanation: 'Not correct. `istioctl install` is client-side templating plus an
      apply: load the profile, overlay `--set` and `-f`, render to manifests, apply,
      wait. The `IstioOperator` is an *input format*, not an object doing work in
      the cluster. Older Istio really did run an in-cluster operator; that model is
      gone, which is why a hand-edit to an installed object persists until the next
      install overwrites it.'
  - id: c
    text: The `IstioOperator` document was rendered into plain Kubernetes manifests
      on your machine and applied; nothing in the cluster is reconciling it afterwards.
    explanation: 'Correct. `istioctl install` is client-side templating plus an apply:
      load the profile, overlay `--set` and `-f`, render to manifests, apply, wait.
      The `IstioOperator` is an *input format*, not an object doing work in the cluster.
      Older Istio really did run an in-cluster operator; that model is gone, which
      is why a hand-edit to an installed object persists until the next install overwrites
      it.'
  - id: d
    text: The `IstioOperator` was stored as a custom resource, which `istiod` watches.
    explanation: 'Not correct. `istioctl install` is client-side templating plus an
      apply: load the profile, overlay `--set` and `-f`, render to manifests, apply,
      wait. The `IstioOperator` is an *input format*, not an object doing work in
      the cluster. Older Istio really did run an in-cluster operator; that model is
      gone, which is why a hand-edit to an installed object persists until the next
      install overwrites it.'
  correct_option: c
  explanation: "`istioctl install` is client-side templating plus an apply: load the
    profile, overlay `--set` and `-f`, render to manifests, apply, wait. The `IstioOperator`
    is an *input format*, not an object doing work in the cluster. Older Istio really
    did run an in-cluster operator; that model is gone, which is why a hand-edit to
    an installed object persists until the next install overwrites it."
