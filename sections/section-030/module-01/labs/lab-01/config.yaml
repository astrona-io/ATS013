metadata:
  name: "ats-013-lab-030-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-tooling"
      description: "Installs helm 3 and both istioctl binaries, and registers the istio chart repository"
      type: "file"
      source: "bootstrap/01-install-tooling.sh"
    - name: "install-istio-1-25-3"
      description: "Installs Istio 1.29.8 as three Helm releases using a values file that is then discarded, and meshes one workload"
      type: "file"
      source: "bootstrap/02-install-istio-helm.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-helm-upgrade"
      description: "Confirms all three releases moved to 1.30.5, that every value from the original install survived, that the requested mesh change was applied, and that the data plane was restarted so no version skew remains"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
