metadata:
  name: "ats-013-lab-030-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-two-istioctl"
      description: "Installs istioctl 1.29.8 as the default binary and istioctl-1.30.5 as the upgrade target"
      type: "file"
      source: "bootstrap/01-install-tooling.sh"
    - name: "install-istio-1-25-3"
      description: "Installs Istio 1.29.8 as the default unrevisioned control plane and meshes the canary-demo namespace"
      type: "file"
      source: "bootstrap/02-install-istio.sh"

validation:
  scripts:
    - name: "verify-canary-upgrade"
      description: "Confirms both control planes are running, the prod revision tag resolves to the new revision, canary-demo follows the tag rather than a raw revision label, and its workload was restarted onto the new control plane"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
