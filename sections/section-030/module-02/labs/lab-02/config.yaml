metadata:
  name: "ats-013-lab-030-02-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-two-istioctl"
      description: "Installs istioctl 1.29.8 as the default binary and istioctl-1.30.5 as the upgrade target"
      type: "file"
      source: "bootstrap/01-install-tooling.sh"
    - name: "install-two-revisions"
      description: "Installs Istio 1.29.8 as the default control plane and 1.30.5 as revision 1-30-5 behind the prod tag; canary-demo follows the tag, canary-legacy is still on the default control plane"
      type: "file"
      source: "bootstrap/02-install-istio.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-old-revision-retired"
      description: "Confirms the default revision is removed, revision 1-30-5 and the CRDs remain, canary-legacy follows the prod tag, every proxy runs 1.30.5, and tester still reaches notification-service"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
