metadata:
  name: "ats-013-lab-010-01-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istioctl"
      description: "Puts istioctl 1.30.5 on the machine"
      type: "file"
      source: "bootstrap/01-install-istioctl.sh"
    - name: "lab-010-01-02-setup"
      description: "Installs Istio with the demo profile, labels mesh-demo for injection and runs two injected workloads in it"
      type: "file"
      source: "bootstrap/02-install-mesh.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-istio-removed"
      description: "Confirms istio-system, the Istio CRDs and webhooks are gone, mesh-demo has no injection label, both workloads were recreated without a sidecar, and tester still gets a 200 from notification-service"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
