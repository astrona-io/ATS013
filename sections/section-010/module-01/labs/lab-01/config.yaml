metadata:
  name: "ats-013-lab-010-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istioctl"
      description: "Puts istioctl 1.30.5 on the machine; leaves the cluster with no Istio"
      type: "file"
      source: "bootstrap/01-install-istioctl.sh"
    - name: "lab-010-01-setup"
      description: "Creates the unlabelled mesh-demo namespace and its workload"
      type: "file"
      source: "bootstrap/02-create-workload.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-istioctl-install"
      description: "Confirms a demo-profile control plane is running, the CRDs and injection webhook exist, mesh-demo is labelled for injection, its workload was restarted into the mesh, and control plane and data plane versions agree"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
