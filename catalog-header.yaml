apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog-header
  namespace: ambient-shop
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: catalog-api
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: x-served-via
                value: waypoint
      backendRefs:
        - name: catalog-api
          port: 80
